name: Deploy playground

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# allow the workflow to publish to Pages
permissions:
  contents: read
  pages: write
  id-token: write

# one deployment at a time; queued runs supersede rather than cancel a live one
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Pages must already be enabled with "GitHub Actions" as its source.
      # enablement: true cannot do it: creating a Pages site needs more than the
      # workflow token is allowed to have, whatever permissions are declared.
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      # the playground imports the library through package.json, so it has to
      # be built before the site that consumes it
      - name: Build library
        run: pnpm run build

      - name: Build playground
        env:
          DEMO_BASE: ${{ steps.pages.outputs.base_path }}/
        run: pnpm run demo:build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: demo-dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
