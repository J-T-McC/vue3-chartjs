name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    # '*' does not match branch names containing '/', which silently skips
    # every pull request targeting one
    branches: [ '**' ]

jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        node-version: [ 24 ]
    steps:
      - uses: actions/checkout@v4

      # version comes from the packageManager field in package.json
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm run build

      # dist/ is committed, so a source change without a rebuild ships a stale
      # bundle and stale type declarations to consumers
      - name: Verify committed dist matches the build
        run: |
          if [ -n "$(git status --porcelain -- dist/)" ]; then
            echo "::error::dist/ is out of date. Run 'pnpm run build' and commit the result."
            git status --porcelain -- dist/
            git diff -- dist/
            exit 1
          fi

      # the standalone coveralls npm package is deprecated and unmaintained
      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          file: ./coverage/lcov.info
          format: lcov
